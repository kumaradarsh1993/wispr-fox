  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 40px 20px 60px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e9e2d4;
    background:
      radial-gradient(1200px 700px at 50% -10%, #3a4654 0%, #232a33 55%, #171b21 100%);
    transition: background 280ms ease;
  }
  body.light {
    color: #2b2218;
    background:
      radial-gradient(1200px 700px at 50% -10%, #f6efe0 0%, #e7dcc6 55%, #d8cab0 100%);
  }
  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: 0.2px; }
  .sub { font-size: 13px; opacity: 0.7; margin: -12px 0 0; text-align: center; max-width: 540px; line-height: 1.5; }
  .frame {
    position: relative;
    display: grid;
    place-items: center;
    width: 520px;
    height: 360px;
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.12)),
      repeating-conic-gradient(rgba(255,255,255,0.025) 0% 25%, transparent 0% 50%) 0 0 / 28px 28px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 24px 60px rgba(0,0,0,0.35);
  }
  body.light .frame {
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 24px 60px rgba(120,90,50,0.18);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.35), rgba(120,90,50,0.06)),
      repeating-conic-gradient(rgba(120,90,50,0.04) 0% 25%, transparent 0% 50%) 0 0 / 28px 28px;
  }
  .stage { transform: scale(var(--zoom, 1.9)); transform-origin: center; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06); color: inherit;
    transition: all 140ms ease;
  }
  body.light button { border-color: rgba(0,0,0,0.12); background: rgba(255,255,255,0.5); }
  button:hover { transform: translateY(-1px); }
  button.active { background: #ec7c34; border-color: #ec7c34; color: #fff; font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; font-size: 13px; opacity: 0.85; }
  input[type=range] { accent-color: #ec7c34; }

  /* ─────────────── duo-hd avatar styles (mirrors clippy/+page.svelte) ─────────────── */
  .hd-skin { width: 200px; height: 130px; filter: drop-shadow(0 5px 9px rgba(80,60,30,0.2)); display: block; }
  .hd-indy-thinkdots, .hd-sparkles { display: none; }
  .hd-skin[data-state="thinking"] .hd-indy-thinkdots { display: block; }
  .hd-skin[data-state="pasting"] .hd-sparkles { display: block; }

  .hd-khao-tail { transform-origin: 34px 120px; animation: hd-khao-tail 8s ease-in-out infinite; }

  @keyframes hd-khao-react { 0%,57%,78%,100% { transform: rotate(0deg) translateY(0); } 61% { transform: rotate(5deg); } 70% { transform: rotate(6deg) translateY(-1px); } }
  @keyframes hd-khao-ear { 0%,63%,69%,90%,95%,100% { transform: rotate(0deg); } 66% { transform: rotate(-15deg); } 67.5% { transform: rotate(5deg); } 92% { transform: rotate(-11deg); } 93.5% { transform: rotate(4deg); } }

  .hd-indy-jumper { animation: hd-pounce 22s ease-in-out infinite; }
  .hd-indy-squashbox { transform-origin: 168px 136px; animation: hd-squash 22s ease-in-out infinite; }
  .hd-indy-castshadow { transform-box: fill-box; transform-origin: center; animation: hd-indy-shadow 22s ease-in-out infinite; }
  .hd-indy-body { transform-origin: 168px 136px; animation: hd-indy-breathe 3.4s ease-in-out infinite; }
  .hd-indy-head { transform-origin: 170px 94px; animation: hd-indy-head-idle 9s ease-in-out infinite; transition: transform 260ms cubic-bezier(0.34,1.4,0.64,1); }
  .hd-indy-tail { transform-origin: 196px 122px; animation: hd-indy-tail 4s ease-in-out infinite; }
  @keyframes hd-pounce {
    0%,52% { transform: translate(0,0); }
    55% { transform: translate(3px,4px); }
    58% { transform: translate(-22px,-12px); }
    61% { transform: translate(-44px,-7px); }
    64% { transform: translate(-54px,2px); }
    66%,76% { transform: translate(-54px,-1px); }
    79% { transform: translate(-26px,-10px); }
    82% { transform: translate(-2px,2px); }
    84%,100% { transform: translate(0,0); }
  }
  @keyframes hd-squash {

    58% { transform: scale(0.9,1.16); }
    61% { transform: scale(0.92,1.12); }
    64% { transform: scale(1.12,0.84); }
    79% { transform: scale(0.9,1.14); }
    82% { transform: scale(1.1,0.88); }

  @keyframes hd-indy-shadow {

  @keyframes hd-boop { 0% { transform: translate(0,0); } 45% { transform: translate(-30px,1px); } 100% { transform: translate(0,0); } }

  .hd-khao-eyes { transform-box: fill-box; transform-origin: center; }
  .hd-indy-eyes { transform-box: fill-box; transform-origin: center; }

  <div class="controls" id="states">
    <button data-st="idle" class="active">Idle (scene loop)</button>
    <button data-st="listening">Listening</button>
    <button data-st="thinking">Thinking</button>
    <button data-st="writing">Writing</button>
    <button data-st="pasting">Pasting</button>
  </div>
  <div class="controls">
    <div class="row">Zoom <input id="zoom" type="range" min="1" max="3" step="0.1" value="1.9"></div>
    <button id="bg">Toggle light desktop</button>
  </div>

<script>
  const svg = document.querySelector('.hd-skin');
  const stage = document.querySelector('.stage');
  // state buttons
  document.getElementById('states').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#states button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    svg.setAttribute('data-state', b.dataset.st);
  });
  // zoom
  document.getElementById('zoom').addEventListener('input', (e) => {
    stage.style.setProperty('--zoom', e.target.value);
  });
  // light/dark desktop
  document.getElementById('bg').addEventListener('click', () => document.body.classList.toggle('light'));
  // ambient blink while idle/hovering states
  setInterval(() => {
    const st = svg.getAttribute('data-state');
    if (st === 'idle' || st === 'listening' || st === 'thinking') {
      svg.classList.add('blink');
      setTimeout(() => svg.classList.remove('blink'), 200);
    }
  }, 3600);
</script>
