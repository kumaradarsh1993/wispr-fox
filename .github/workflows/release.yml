# Cross-platform release builds for wispr-fox.
#
# Triggers:
#   - push to a tag matching v* (e.g. `git tag v1.0.0 && git push --tags`)
#   - manual run from the Actions tab
#
# Pipeline:
#   1. create-release    drafts a GitHub release for the tag (once)
#   2. build (matrix)    builds Windows/macOS-ARM/Linux and uploads artifacts
#                        into the draft created in step 1
#   3. publish-release   flips draft -> published once all builds succeed
#
# Why the 3-job split: tauri-action with releaseDraft:true is racy when
# run in parallel from a matrix - each job tries to create-or-find the
# draft, and whichever loses the race ends up looking for a draft that
# no longer exists (it was already published or already has uploads).
# Pre-creating the draft and passing releaseId removes the race.
#
# macOS Intel (macos-13) is intentionally omitted: GitHub stopped
# allocating those runners reliably (24h queue timeouts). Re-add as
# macos-13-large or revisit when the runner pool changes.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              `Built from commit ${context.sha}.`,
              '',
              '**Pick your installer:**',
              '- **Windows:** `wispr-fox_*_x64-setup.exe` (recommended) or `*_x64_en-US.msi`',
              '- **macOS Apple Silicon (M1/M2/M3/M4):** `wispr-fox_*_aarch64.dmg`',
              '- **Linux:** `*.AppImage` (portable) or `*.deb` (Ubuntu/Debian)',
              '',
              '## First-time install — please read',
              '',
              '**Windows.** Run the `.exe`, click through SmartScreen ("More info" → "Run anyway") on first launch since the binary isn\'t code-signed yet.',
              '',
              '**macOS.** The build isn\'t notarized. One of two things will happen on first launch:',
              '',
              '- *"developer cannot be verified" dialog:* Cancel → right-click the app in Applications → Open → click Open in the new dialog.',
              '- *"App is damaged" dialog:* open Terminal and run `xattr -dr com.apple.quarantine /Applications/wispr-fox.app`, then double-click normally.',
              '',
              'Then grant two permissions when prompted:',
              '1. **Microphone** (first time you press F8) — required',
              '2. **Accessibility** (first time it tries to paste) — required for fast text injection; if you skip it, the app falls back to clipboard+Cmd+V which still works but is slower',
              '',
              `Full install walkthrough in the [README](https://github.com/${context.repo.owner}/${context.repo.repo}#macos-first-time-install-walkthrough).`,
              '',
              '**Linux.** AppImage is portable — `chmod +x` and run. Untested by maintainer; report issues.',
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `wispr-fox ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;
          result-encoding: string

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
            artifact_name: 'wispr-fox-macos-arm64'
          - platform: 'ubuntu-22.04'
            args: ''
            artifact_name: 'wispr-fox-linux-x64'
          - platform: 'windows-latest'
            args: ''
            artifact_name: 'wispr-fox-windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment for signed Mac builds:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              make_latest: 'true',
            });
