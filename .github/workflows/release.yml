# Cross-platform release builds for wispr-fox.
#
# Triggers:
#   - push to a tag matching v* (e.g. `git tag v0.1.0 && git push --tags`)
#   - manual run from the Actions tab
#
# Builds on Windows + macOS (Intel + Apple Silicon) + Linux, uploads installers
# as artifacts AND attaches them to a GitHub Release if the run was tag-driven.
#
# Prerequisites:
#   - GitHub repository exists with the project pushed (no extra secrets needed)
#   - For code-signed Mac builds, add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
#     secrets and uncomment the signing block below. Unsigned builds work without.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
            artifact_name: 'wispr-fox-macos-arm64'
          - platform: 'macos-13'  # Intel
            args: '--target x86_64-apple-darwin'
            artifact_name: 'wispr-fox-macos-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            artifact_name: 'wispr-fox-linux-x64'
          - platform: 'windows-latest'
            args: ''
            artifact_name: 'wispr-fox-windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || (matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '') }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment for signed Mac builds:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'wispr-fox ${{ github.ref_name }}'
          releaseBody: |
            Built from commit ${{ github.sha }}.

            **Installers:**
            - Windows: `wispr-fox_*_x64-setup.exe` (NSIS) or `*_x64_en-US.msi`
            - macOS (Apple Silicon): `wispr-fox_*_aarch64.dmg`
            - macOS (Intel): `wispr-fox_*_x64.dmg`
            - Linux: `*.AppImage` or `*.deb`

            ⚠ First-launch on Windows / macOS may need clicking past the
            unsigned-app warning. Code signing certs aren't bundled.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || (matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '') }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
