# Cross-platform release builds for wispr-fox.
#
# Triggers:
#   - push to a tag matching v* (e.g. `git tag v1.0.0 && git push --tags`)
#
# Pipeline:
#   1. verify            validates metadata and runs the frontend/Rust gates
#   2. create-release    drafts a GitHub release for the tag (once)
#   3. build (matrix)    builds Windows/macOS-ARM/Linux and uploads artifacts
#                        into the draft created in step 2
#   4. publish-release   flips draft -> published once all builds succeed
#
# Channels (tag-name driven):
#   - Stable:  tags like `v1.2.3` -> published as Latest, prerelease=false
#   - Nightly: tags like `v1.2.3-nightly.1`/
#              `-rc.1`/`-beta.1` -> published as Pre-release, NOT Latest
#   Detection lives in the create-release script (isPrerelease).
#
# Why the 4-job split: tauri-action with releaseDraft:true is racy when
# run in parallel from a matrix - each job tries to create-or-find the
# draft, and whichever loses the race ends up looking for a draft that
# no longer exists (it was already published or already has uploads).
# Pre-creating the draft and passing releaseId removes the race.
#
# macOS Intel (macos-13) is intentionally omitted: GitHub stopped
# allocating those runners reliably (24h queue timeouts). Re-add as
# macos-13-large or revisit when the runner pool changes.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libxdo-dev

      - name: Validate tag, versions, and release notes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME : '';
          if (!/^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release workflow must run from a v* tag; got ${process.env.GITHUB_REF}`);
          }
          const expected = tag.slice(1);
          const packageVersion = require('./package.json').version;
          const tauriVersion = require('./src-tauri/tauri.conf.json').version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const packageBlock = cargo.match(/\[package\]([\s\S]*?)(?:\n\[|$)/)?.[1] ?? '';
          const cargoVersion = packageBlock.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = { packageVersion, cargoVersion, tauriVersion };
          for (const [source, version] of Object.entries(versions)) {
            if (version !== expected) throw new Error(`${source}=${version}; tag requires ${expected}`);
          }
          const notesPath = `docs/RELEASE_NOTES_${tag}.md`;
          if (!fs.existsSync(notesPath)) throw new Error(`Missing release notes: ${notesPath}`);
          if (!fs.readFileSync(notesPath, 'utf8').trim()) throw new Error(`Empty release notes: ${notesPath}`);
          console.log(`Verified ${tag}: versions aligned and ${notesPath} present.`);
          NODE

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test Rust library
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  create-release:
    needs: verify
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      is_prerelease: ${{ steps.create.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const isPrerelease = tag.startsWith('nightly-') || /-(nightly|pre|rc|alpha|beta)\b/.test(tag);
            core.setOutput('is_prerelease', String(isPrerelease));
            const notesPath = `docs/RELEASE_NOTES_${tag}.md`;
            if (!fs.existsSync(notesPath)) {
              core.setFailed(`Missing release notes: ${notesPath}`);
              return;
            }
            const releaseNotes = fs.readFileSync(notesPath, 'utf8').trim();
            const channelHeader = isPrerelease
              ? '> Pre-release / nightly build. Not the latest stable.\n> Stable users: see [Releases page](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases) and pick the most recent "Latest" tag.\n\n'
              : '';
            const body = channelHeader + releaseNotes + '\n\n---\n\n' + [
              `Built from commit ${context.sha}.`,
              'Provenance: built by GitHub Actions from the tagged commit. See the release notes header for which agent authored the change set.',
              '',
              '**Pick your installer:**',
              '- **Windows:** `wispr-fox_*_x64-setup.exe`',
              '- **macOS Apple Silicon (M1/M2/M3/M4):** `wispr-fox_*_aarch64.dmg`',
              '- **Linux:** `*.AppImage` (portable) or `*.deb` (Ubuntu/Debian)',
              '',
              '## First-time install — please read',
              '',
              '**Windows.** Run the `.exe`, click through SmartScreen ("More info" → "Run anyway") on first launch since the binary isn\'t code-signed yet.',
              '',
              '**macOS.** The build is code-signed (ad-hoc) but not notarized, so Gatekeeper stops it exactly once. After dragging to Applications:',
              '',
              '1. Double-click wispr-fox. macOS says it *cannot verify the developer* — click **Done**.',
              '2. Open **System Settings → Privacy & Security**, scroll to the Security section, and click **Open Anyway** next to wispr-fox.',
              '3. Confirm. It launches normally from then on.',
              '',
              'One-line Terminal equivalent: `xattr -dr com.apple.quarantine /Applications/wispr-fox.app`',
              '',
              '> Right-click → Open no longer bypasses Gatekeeper on macOS 15 (Sequoia) and newer. Use **Open Anyway** above.',
              '',
              'Then grant two permissions when prompted:',
              '1. **Microphone** (first time you press F8) — required',
              '2. **Accessibility** (first time it tries to paste) — required for fast text injection; if you skip it, the app falls back to clipboard+Cmd+V which still works but is slower',
              '',
              `Full install walkthrough in the [README](https://github.com/${context.repo.owner}/${context.repo.repo}#macos-first-time-install-walkthrough).`,
              '',
              '**Linux.** AppImage is portable — `chmod +x` and run. Untested by maintainer; report issues.',
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `wispr-fox ${tag}`,
              body,
              draft: true,
              prerelease: isPrerelease,
            });
            return data.id;
          result-encoding: string

  build:
    needs: [verify, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
            artifact_name: 'wispr-fox-macos-arm64'
          - platform: 'ubuntu-22.04'
            args: ''
            artifact_name: 'wispr-fox-linux-x64'
          - platform: 'windows-latest'
            args: ''
            artifact_name: 'wispr-fox-windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing with a STABLE self-signed identity ──────────
          # Why this exists: macOS ties an Accessibility (TCC) grant to the
          # app's code-signing identity. An UNSIGNED app is keyed by its
          # per-build cdhash, so every nightly update invalidates the grant —
          # the user has to re-add wispr-fox to Accessibility after each update
          # and auto-paste silently breaks until they do. Signing every build
          # with ONE stable self-signed cert gives the app a constant
          # designated requirement, so the grant persists across updates.
          #
          # This needs NO paid Apple Developer cert ($99) and does NOT notarize
          # (Gatekeeper's right-click-Open / xattr step is unchanged). It ONLY
          # buys TCC-grant persistence. One-time setup in docs/MACOS_SIGNING.md:
          # generate a self-signed Code Signing cert, export the .p12, and add
          # these three repo secrets.
          #
          # LIVE since 2026-09-02. The three secrets are set on this repo; the
          # certificate and its password are archived on the build machine at
          # D:/android-dev/keystores/ (see README-wispr-fox.txt there).
          #
          # Do NOT comment these back out one at a time, and do NOT leave one
          # set to an empty value: tauri-action treats even an EMPTY
          # APPLE_SIGNING_IDENTITY as "please sign", then fails at
          # `security import` with no certificate to import. That is what broke
          # the v1.3.0 macOS build. Either all three are present, or all three
          # are gone.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization (optional, needs a paid Apple Developer account) stays
          # off — leave these commented until/unless we enroll:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Guard against the failure that shipped in every build up to v3.4.0:
      # tauri-bundler wrapped a linker-signed (ad-hoc) Mach-O into an .app but
      # never signed the BUNDLE, so Contents/_CodeSignature was missing. The
      # signature then claims sealed resources that do not exist, and macOS
      # reports "wispr-fox is damaged and can't be opened" - a hard failure
      # with no "Open Anyway" escape hatch. Catch it in CI, not in Downloads.
      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
                  -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle produced by the build"; exit 1
          fi
          echo "Verifying $APP"
          if [ ! -f "$APP/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::Missing Contents/_CodeSignature/CodeResources - Gatekeeper will call this app damaged"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Signed, but by whom? An ad-hoc signature also passes the check
          # above, and silently reverting to one would reinstate the bug this
          # certificate exists to kill: macOS keys the Accessibility grant to
          # the signing identity, so a per-build identity means the user
          # re-grants it after every single update. Fail loudly instead.
          AUTHORITY=$(codesign -dv --verbose=4 "$APP" 2>&1 | grep '^Authority=' | head -1 || true)
          echo "Signed by: ${AUTHORITY:-<none>}"
          if [ "$AUTHORITY" != "Authority=wispr-fox self-signed" ]; then
            echo "::error::Expected 'Authority=wispr-fox self-signed', got '${AUTHORITY:-<none>}'. The macOS Accessibility grant will reset on every update until this is fixed - check the APPLE_CERTIFICATE secrets."
            exit 1
          fi
          echo "Bundle signature verified, with the stable identity."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          IS_PRERELEASE: ${{ needs.create-release.outputs.is_prerelease }}
        with:
          script: |
            const isPrerelease = process.env.IS_PRERELEASE === 'true';
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: isPrerelease,
              make_latest: isPrerelease ? 'false' : 'true',
            });
