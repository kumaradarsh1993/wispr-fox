[package]
name = "wispr-fox"
version = "1.3.0-nightly.6"
description = "WisperFlow-style desktop dictation: hotkey speech-to-text with optional LLM cleanup"
authors = ["wispr-fox contributors"]
edition = "2021"

[lib]
name = "wispr_fox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"

# Async runtime + HTTP for STT/LLM clients
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
async-trait = "0.1"

# Audio capture + WAV encoding
cpal = "0.15"
hound = "3"

# Clipboard with text + image preservation
arboard = "3"

# Audio cues (start/stop tones) — generated sine waves OR user-supplied
# files dropped at %APPDATA%/com.wispr-fox.app/sounds/{start,stop}.{wav,mp3}
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "vorbis"] }

# Windows Credential Manager for API keys (primary); file fallback via dirs
keyring = "3"
dirs = "6"

# History DB (bundled = ships SQLite, no system dep)
rusqlite = { version = "0.32", features = ["bundled"] }

# Errors, logging, ids, time
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Sync primitives
once_cell = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Foundation",
] }

# macOS text injection via Core Graphics / Quartz Event Services.
# CGEvent + CGEventSource for synthesized unicode keystrokes — analog of
# Win32 SendInput. The user must grant Accessibility permission for
# events to reach focused apps (System Settings → Privacy & Security →
# Accessibility); without it the clipboard fallback kicks in.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.10"
# Touch Bar support — objc2 + objc2-foundation are already transitive deps
# from Tauri; adding them as direct deps pins the version and enables the
# features we need (NSTouchBar, NSButton, etc.).  Zero added weight on
# non-macOS builds.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
  "NSTouchBar",
  "NSTouchBarItem",
  "NSCustomTouchBarItem",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSColor",
  "NSApplication",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
# Trade a few percent of binary size for build reliability on lower-RAM
# machines. Previous profile (lto = true, codegen-units = 1) consumed
# ~6-8 GB during the final codegen step and OOM'd rustc on Windows
# during the v1.0.0 build. Thin LTO + default codegen-units = 16 still
# strips dead code and inlines hot paths, just less aggressively.
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
